<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Management System</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f5f9;margin:0;color:#20283a}.wrap{max-width:950px;margin:35px auto;padding:20px}.panel{background:white;padding:22px;border-radius:14px;box-shadow:0 5px 20px #1b2b4412;margin:16px 0}h1{color:#243b68}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}input,button{padding:12px;border:1px solid #ccd3df;border-radius:8px;font-size:15px}button{background:#284b86;color:white;border:0;cursor:pointer}button:hover{background:#19345f}.delete{background:#b53b45;padding:7px 10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e8ee}small{color:#697386}
</style></head><body><div class="wrap"><h1>Student Management System</h1><p>Add, search and remove student records. Data is saved in this browser.</p>
<div class="panel"><h2>Add Student</h2><form id="studentForm"><input id="name" placeholder="Student name" required><input id="roll" placeholder="Roll number" required><input id="course" placeholder="Course / Class" required><button>Add Student</button></form></div>
<div class="panel"><h2>Student Records</h2><input id="search" placeholder="Search by name, roll or course" style="width:100%;margin-bottom:12px"><p id="count"><small>0 students</small></p><div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Roll No.</th><th>Course</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
const KEY='azeem_students_v1';let students=JSON.parse(localStorage.getItem(KEY)||'[]');
const form=document.getElementById('studentForm'),rows=document.getElementById('rows'),search=document.getElementById('search');
function save(){localStorage.setItem(KEY,JSON.stringify(students));render()}
function render(){const q=search.value.toLowerCase();const shown=students.filter(s=>(s.name+' '+s.roll+' '+s.course).toLowerCase().includes(q));rows.innerHTML='';shown.forEach(s=>{const tr=document.createElement('tr');[s.name,s.roll,s.course].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const td=document.createElement('td'),b=document.createElement('button');b.textContent='Delete';b.className='delete';b.onclick=()=>{students=students.filter(x=>x.id!==s.id);save()};td.appendChild(b);tr.appendChild(td);rows.appendChild(tr)});document.getElementById('count').textContent=shown.length+' student(s) shown'}
form.addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),roll=document.getElementById('roll').value.trim(),course=document.getElementById('course').value.trim();if(students.some(s=>s.roll.toLowerCase()===roll.toLowerCase())){alert('This roll number already exists.');return}students.push({id:Date.now(),name,roll,course});form.reset();save()});search.addEventListener('input',render);render();
</script></body></html>
