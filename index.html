<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Smart Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9edf5;font-family:Arial,sans-serif}.calc{width:min(340px,94vw);background:#172238;padding:20px;border-radius:20px;box-shadow:0 18px 40px #18243b35}.screen{width:100%;height:78px;border:0;border-radius:10px;margin-bottom:14px;padding:14px;text-align:right;font-size:30px;background:#f7f9fc;color:#172238}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}button{height:58px;border:0;border-radius:10px;font-size:20px;background:#2b3b59;color:white;cursor:pointer}button:hover{filter:brightness(1.2)}.op{background:#b78b35}.equal{background:#2c8b68}.clear{background:#a94452}.hint{text-align:center;color:#c8d2e4;font-size:12px}
</style></head><body><div class="calc"><input id="screen" class="screen" value="0" readonly aria-label="Calculator display"><div class="keys">
<button class="clear" data-action="clear">AC</button><button data-action="delete">DEL</button><button data-value="(">(</button><button class="op" data-value="/">÷</button>
<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="op" data-value="*">×</button>
<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="op" data-value="-">−</button>
<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="op" data-value="+">+</button>
<button data-value="0">0</button><button data-value=".">.</button><button data-value=")">)</button><button class="equal" data-action="equals">=</button>
</div><p class="hint">Keyboard supported · Basic arithmetic</p></div>
<script>
const screen=document.getElementById('screen');let expr='',done=false;
function show(){screen.value=expr||'0'}
function calculate(){if(!expr)return;try{if(!/^[0-9+*/().\s-]+$/.test(expr))throw Error();const result=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(result))throw Error();expr=String(Number(result.toFixed(10)));done=true;show()}catch{screen.value='Error';expr='';done=true}}
document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action,v=b.dataset.value;if(a==='clear'){expr='';done=false;show()}else if(a==='delete'){expr=expr.slice(0,-1);done=false;show()}else if(a==='equals'){calculate()}else{if(done){expr='';done=false}expr+=v;show()}});
document.addEventListener('keydown',e=>{if(/^[0-9+\-*/().]$/.test(e.key)){if(done){expr='';done=false}expr+=e.key;show()}else if(e.key==='Enter'){calculate()}else if(e.key==='Backspace'){expr=expr.slice(0,-1);show()}else if(e.key==='Escape'){expr='';show()}});
</script></body></html>
