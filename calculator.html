
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Calculator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg,#141414,#292929);
    font-family: Arial, sans-serif;
}

.calculator {
    width: 320px;
    padding: 22px;
    background: #202020;
    border-radius: 20px;
    box-shadow: 0 10px 30px #000;
}

h2 {
    color: #d4af37;
    text-align: center;
    margin-bottom: 20px;
}

#display {
    width: 100%;
    height: 65px;
    background: #111;
    border: 2px solid #d4af37;
    border-radius: 10px;
    color: white;
    font-size: 28px;
    text-align: right;
    padding: 10px;
    margin-bottom: 15px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
}

button {
    height: 55px;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: #383838;
    color: white;
}

button:active {
    transform: scale(.95);
}

.operator {
    background: #b48b20;
    color: white;
}

.clear {
    background: #c0392b;
}

.equal {
    background: #218c74;
}

.zero {
    grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculator">
    <h2>Smart Calculator</h2>

    <input type="text" id="display"
    placeholder="0" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="add('/')">÷</button>
        <button class="operator" onclick="add('*')">×</button>

        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button class="operator" onclick="add('-')">−</button>

        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button class="operator" onclick="add('+')">+</button>

        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>

        <button class="zero" onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>
    </div>
</div>

<script>
const display = document.getElementById("display");

function add(value) {
    display.value += value;
}

function clearDisplay() {
    display.value = "";
}

function deleteLast() {
    display.value = display.value.slice(0,-1);
}

function calculate() {
    try {
        if (!/^[0-9+\-*/.() ]+$/.test(display.value)) {
            throw new Error("Invalid");
        }
        const result = Function(
            '"use strict"; return (' + display.value + ')'
        )();

        display.value = Number.isFinite(result)
            ? String(result) : "Error";
    } catch {
        display.value = "Error";
    }
}
</script>

</body>
</html>
